<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>平安闯关普法飞行棋 - 游戏规则</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft YaHei",PingFang SC,sans-serif;
}
body{
    background:#eaf6ff;
    min-height:100vh;
    display:flex;
    align-items:center;
    padding:10px;
}
.wrap{
    width:100%;
    max-width:640px;
    margin:0 auto;
    background:#fff;
    border-radius:14px;
    border:2px solid #2563eb;
    padding:16px;
}
h1{
    text-align:center;
    color:#2563eb;
    margin-bottom:12px;
    font-size:20px;
}
h2{
    color:#1d4ed8;
    margin:10px 0 4px;
    font-size:16px;
}
p,li{
    font-size:14px;
    line-height:1.5;
    color:#333;
}
ul{
    padding-left:20px;
    margin-bottom:8px;
}
.btn-box{
    text-align:center;
    margin-top:16px;
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
}
.btn{
    padding:10px 24px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    text-decoration:none;
}
</style>
</head>
<body>
<div class="wrap">
    <h1>平安闯关普法飞行棋｜游戏规则</h1>
    <h2>🎯 游戏目标</h2>
    <p>操控棋子从起点出发，抵达第19号终点格子，完成普法闯关。</p>
    <h2>📖 玩法说明</h2>
    <ul>
        <li>点击【掷骰子】随机点数，棋子向前走对应步数</li>
        <li>棋子停下弹出普法选择题作答</li>
        <li>答对可继续掷骰子；答错后退2步</li>
        <li>走到终点即闯关胜利</li>
    </ul>
    <h2>📚 题目范围</h2>
    <ul>
        <li>校园欺凌、网络安全、隐私保护</li>
        <li>青少年自我保护、禁毒、矛盾处理</li>
    </ul>
    <h2>💡 小提示</h2>
    <ul>
        <li>首次点击页面才能播放音频</li>
    </ul>
    <div class="btn-box">
        <button class="btn" id="ruleMusicBtn">开启背景音乐</button>
        <a class="btn" href="index.html">开始游戏</a>
    </div>
</div>

<audio id="ruleBgm" loop preload="auto">
    <source src="happy_time.mp3" type="audio/mpeg">
<script>
let musicOpen = false;
const bgm = document.getElementById("ruleBgm");
const btn = document.getElementById("ruleMusicBtn");
bgm.volume = 0.28;
document.body.addEventListener("click", unlock, {once:true});
document.body.addEventListener("touchstart", unlock, {once:true});
function unlock(){}
btn.onclick = function(){
    if(!musicOpen){
        bgm.play();
        musicOpen = true;
        btn.innerText = "关闭背景音乐";
    }else{
        bgm.pause();
        musicOpen = false;
        btn.innerText = "开启背景音乐";
    }
}
</script>
</body>
</html>
