<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>做自己的安全小卫士</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-tap-highlight-color: transparent;
}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:url("campus_bg.jpg") center center / cover no-repeat fixed;
}
.container{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:min(2vw,10px);
    background:transparent;
}
#boardWrap{
    width:min(92vw,820px);
    height:min(92vw,820px);
    position:relative;
    border:none;
    border-radius:18px;
    background:transparent;
    margin-bottom:20px;
    overflow:hidden;
}
.board-inner{
    position:relative;
    width:100%;
    height:100%;
}
.board-title{
    display:none;
}
@keyframes gridPop{
    0%{transform:scale(0.6);opacity:0;}
    100%{transform:scale(1);opacity:1;}
}
.grid{
    position:absolute;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(12px,2.4vw,14px);
    font-weight:600;
    color:#111;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,0.08);
    animation:gridPop 0.4s ease-out forwards;
    opacity:0;
}
.grid-number{
    font-size:clamp(20px,5vw,28px);
    font-weight:bold;
    color:#111;
    text-shadow:none;
}
.player{
    width:clamp(28px,6.5vw,36px);
    height:clamp(28px,6.5vw,36px);
    background:radial-gradient(circle at 35% 35%,#ff9494 0%,#e53745 45%,#b51c2c 100%);
    border-radius:50%;
    position:absolute;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:bold;
    font-size:clamp(12px,2.2vw,15px);
    transition:all 0.4s cubic-bezier(0.22,1,0.36,1);
    box-shadow:
        0 3px 8px rgba(0,0,0,0.04),
        inset 0 -3px 0 #b51c2c,
        inset 0 3px 6px rgba(255,255,255,0.25);
}
.dice-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    margin-bottom:24px;
}
.dice-row{
    display:flex;
    gap:min(6vw,24px);
    align-items:center;
}
#diceBox{
    width:clamp(32px,7vw,44px);
    height:clamp(32px,7vw,44px);
    perspective:90px;
}
.dice{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.55s ease;
}
@keyframes diceShake{
    0%{transform:rotateX(0deg) rotateY(0deg);}
    25%{transform:rotateX(90deg) rotateY(90deg);}
    50%{transform:rotateX(180deg) rotateY(180deg);}
    75%{transform:rotateX(270deg) rotateY(270deg);}
    100%{transform:rotateX(360deg) rotateY(360deg);}
}
.dice-shake{
    animation:diceShake 0.08s infinite linear;
}
.dice-face{
    position:absolute;
    width:44px;
    height:44px;
    background:#fff;
    border:2px solid #333;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
}
.dice-face-inner{
    width:100%;
    height:100%;
    position:relative;
}
.dot{
    width:clamp(6px,1.6vw,9px);
    height:clamp(6px,1.6vw,9px);
    border-radius:50%;
    background:#222;
    position:absolute;
}
.dice-face-1{transform:translateZ(22px);}
.dice-face-2{transform:rotateY(180deg) translateZ(22px);}
.dice-face-3{transform:rotateY(90deg) translateZ(22px);}
.dice-face-4{transform:rotateY(-90deg) translateZ(22px);}
.dice-face-5{transform:rotateX(90deg) translateZ(22px);}
.dice-face-6{transform:rotateX(-90deg) translateZ(22px);}
#diceBtn{
    width:clamp(84px,20vw,100px);
    height:clamp(42px,8.5vw,52px);
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    border:none;
    font-size:clamp(14px,2.6vw,16px);
    font-weight:bold;
    cursor:pointer;
}
#diceBtn:disabled{
    background:#8899bb;
    cursor:not-allowed;
}
.btns-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
}
.bottom-btn{
    padding:8px 14px;
    border:none;
    border-radius:8px;
    background:#3b82f6;
    color:#fff;
    font-size:clamp(13px,2.4vw,15px);
    cursor:pointer;
}
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:min(5vw,20px);
}
.modal-box{
    width:100%;
    max-width:440px;
    background:#fff;
    border-radius:16px;
    padding:min(6vw,26px);
    box-shadow:0 2px 12px rgba(0,0,0,0.15);
}
.question{
    font-size:clamp(16px,3vw,17px);
    margin-bottom:min(5vw,20px);
}
.opt{
    padding:min(4vw,14px);
    border:1px solid #ddd;
    border-radius:9px;
    margin-bottom:min(3vw,10px);
    cursor:pointer;
    font-size:clamp(15px,2.8vw,16px);
}
.opt:hover{
    background:#e8f0fe;
}
.tip{
    margin-top:min(4vw,16px);
    display:none;
    font-size:clamp(15px,2.8vw,16px);
}
.correct{color:#239b56;font-weight:bold;}
.wrong{color:#d63031;font-weight:bold;}
.success-box{text-align:center;}
.restart-btn{
    margin-top:min(5vw,20px);
    padding:min(3vw,12px) min(7vw,28px);
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:clamp(15px,2.8vw,16px);
    cursor:pointer;
}
</style>
</head>
<body>
<div class="container">
    <div id="boardWrap">
        <div class="board-inner"></div>
    </div>
    <div class="dice-area">
        <div class="dice-row">
            <div id="diceBox">
                <div class="dice" id="diceEl">
                    <div class="dice-face dice-face-1">
                        <div class="dice-face-inner">
                            <span class="dot" style="top:50%;left:50%;transform:translate(-50%,-50%);"></span>
                        </div>
                    </div>
                    <div class="dice-face dice-face-2">
                        <div class="dice-face-inner">
                            <span class="dot" style="top:10%;left:10%;"></span>
                            <span class="dot" style="bottom:10%;right:10%;"></span>
                        </div>
                    </div>
                    <div class="dice-face dice-face-3">
                        <div class="dice-face-inner">
                            <span class="dot" style="top:10%;left:10%;"></span>
                            <span class="dot" style="top:50%;left:50%;transform:translate(-50%,-50%);"></span>
                            <span class="dot" style="bottom:10%;right:10%;"></span>
                        </div>
                    </div>
                    <div class="dice-face dice-face-4">
                        <div class="dice-face-inner">
                            <span class="dot" style="top:10%;left:10%;"></span>
                            <span class="dot" style="top:10%;right:10%;"></span>
                            <span class="dot" style="bottom:10%;left:10%;"></span>
                            <span class="dot" style="bottom:10%;right:10%;"></span>
                        </div>
                    </div>
                    <div class="dice-face dice-face-5">
                        <div class="dice-face-inner">
                            <span class="dot" style="top:10%;left:10%;"></span>
                            <span class="dot" style="top:10%;right:10%;"></span>
                            <span class="dot" style="top:50%;left:50%;transform:translate(-50%,-50%);"></span>
                            <span class="dot" style="bottom:10%;left:10%;"></span>
                            <span class="dot" style="bottom:10%;right:10%;"></span>
                        </div>
                    </div>
                    <div class="dice-face dice-face-6">
                        <div class="dice-face-inner">
                            <span class="dot" style="top:10%;left:10%;"></span>
                            <span class="dot" style="top:10%;right:10%;"></span>
                            <span class="dot" style="top:50%;left:10%;transform:translateY(-50%);"></span>
                            <span class="dot" style="top:50%;right:10%;transform:translateY(-50%);"></span>
                            <span class="dot" style="bottom:10%;left:10%;"></span>
                            <span class="dot" style="bottom:10%;right:10%;"></span>
                        </div>
                    </div>
                </div>
            </div>
            <button id="diceBtn">掷骰子</button>
        </div>
    </div>
    <div class="btns-row">
        <button class="bottom-btn" onclick="window.location.href='game_rule.html'">游戏规则</button>
        <button class="bottom-btn" onclick="restartGame()">重新开始</button>
        <button id="musicToggle" class="bottom-btn">开启背景音乐</button>
    </div>
</div>
<div class="modal" id="quizModal">
    <div class="modal-box">
        <div class="question" id="qText"></div>
        <div id="optWrap"></div>
        <div class="tip" id="tipText"></div>
    </div>
</div>
<div class="modal" id="winModal">
    <div class="modal-box success-box">
        <h2>🎉 闯关成功</h2>
        <p style="margin:15px 0;color:#666;">恭喜完成安全知识飞行棋全部关卡！</p>
        <button class="restart-btn" onclick="restartGame()">再来一局</button>
    </div>
</div>

<audio id="bgMusic" loop preload="auto">
    <source src="happy_time.mp3" type="audio/mpeg">

<audio id="soundDice" preload="auto">
    <source src="dice.mp3" type="audio/mpeg">

<audio id="soundStep" preload="auto">
    <source src="step.mp3" type="audio/mpeg">

<audio id="soundBack" preload="auto">
    <source src="back.mp3" type="audio/mpeg">

<audio id="soundRight" preload="auto">
    <source src="right.mp3" type="audio/mpeg">

<audio id="soundWrong" preload="auto">
    <source src="wrong.mp3" type="audio/mpeg">

<audio id="soundWin" preload="auto">
    <source src="win.mp3" type="audio/mpeg">

<audio id="soundUnlock" preload="auto">
    <source src="gridpop.mp3" type="audio/mpeg">


<script>
const AUDIO_VOLUME = 0.6;
let audioUnlocked = false;
let musicPlay = false;

const bgMusic = document.getElementById("bgMusic");
const soundDice = document.getElementById("soundDice");
const soundStep = document.getElementById("soundStep");
const soundBack = document.getElementById("soundBack");
const soundRight = document.getElementById("soundRight");
const soundWrong = document.getElementById("soundWrong");
const soundWin = document.getElementById("soundWin");
const soundUnlock = document.getElementById("soundUnlock");

bgMusic.volume = AUDIO_VOLUME;
soundDice.volume = AUDIO_VOLUME;
soundStep.volume = AUDIO_VOLUME;
soundBack.volume = AUDIO_VOLUME;
soundRight.volume = AUDIO_VOLUME;
soundWrong.volume = AUDIO_VOLUME;
soundWin.volume = AUDIO_VOLUME;
soundUnlock.volume = AUDIO_VOLUME;

const questionList = [
    {q:"同学长期给他人起侮辱外号、故意孤立他人，属于？",opts:["正常玩笑","校园欺凌","友好互动"],answer:1,explain:"语言侮辱、社交孤立都属于校园欺凌，遇到要及时告诉老师家长。",encourage:"很棒！分清什么是校园欺凌！"},
    {q:"遭遇校园欺凌，合适的做法是？",opts:["默默忍受","告诉老师家长","找人报复对方"],answer:1,explain:"不要隐忍，也不要以暴制暴，寻求成年人保护是正确选择。",encourage:"做得对！遇到伤害一定要求助！"},
    {q:"看见同学被欺凌，我们应该？",opts:["围观起哄","保证安全前提下报告老师","装作没看见"],answer:1,explain:"不要盲目上前冲突，优先报告老师，保护自身安全。",encourage:"有正义感，懂得保护自己！"},
    {q:"网上P丑图造谣辱骂同学属于？",opts:["普通玩梗","网络欺凌","不算违法"],answer:1,explain:"网络造谣、恶意P图属于网络欺凌，同样需要承担责任。",encourage:"正确！网络不是法外之地！"},
    {q:"陌生人给饮料零食，我们应当？",opts:["直接收下","礼貌拒绝离开","道谢收下"],answer:1,explain:"不要随意接受陌生人食物，保护自身安全。",encourage:"很棒！提高警惕保护自己！"},
    {q:"关于毒品说法正确的是？",opts:["尝一次没事","远离毒品，绝不尝试","只有大人才会吸毒"],answer:1,explain:"毒品危害极大，无论什么情况都不能触碰。",encourage:"正确！珍爱生命远离毒品！"},
    {q:"有人让你保守身体被侵犯的秘密，你应该？",opts:["守口如瓶","告诉信任的长辈","害怕不敢说"],answer:1,explain:"让你受伤害的秘密不需要守住，勇敢告诉大人。",encourage:"记住，受伤害不是你的错！"},
    {q:"下面哪一个属于隐私部位？",opts:["手掌","背心和内裤覆盖区域","额头"],answer:1,explain:"背心、内裤遮盖的身体部位属于隐私部位，不许别人随意触碰。",encourage:"很好，懂得保护身体隐私！"},
    {q:"网友索要你的家庭住址、学校，你应该？",opts:["直接发送","拒绝并告诉家长","好奇就给对方"],answer:1,explain:"家庭、学校属于个人隐私，不能随便透露给网络陌生人。",encourage:"保护个人信息，非常重要！"},
    {q:"和同学发生矛盾，正确做法？",opts:["争吵动手","冷静沟通找老师调解","一直冷战"],answer:1,explain:"有矛盾好好沟通，解决不了找老师帮忙，不要激化冲突。",encourage:"学会理性处理矛盾！"},
    {q:"遇到有人在校索要财物，我们应该？",opts:["上前制止","远离并报告老师","假装没看见"],answer:1,explain:"优先保证自身安全，第一时间向老师报告。",encourage:"懂得保护自己，机智应对！"},
    {q:"对于校园欺凌，以下说法正确的是？",opts:["受害者自己解决","欺凌是错误的，旁观者也可以帮助受害者","只有打架才算欺凌"],answer:1,explain:"欺凌不只是打架，语言、孤立、造谣都属于欺凌。",encourage:"很好，全面认识校园欺凌！"}
];

let unusedQuestions = [];
function resetQuestionPool(){
    unusedQuestions = [...questionList];
    shuffleArray(unusedQuestions);
}
function shuffleArray(arr){
    for(let i = arr.length -1; i>0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]] = [arr[j],arr[i]];
    }
}
resetQuestionPool();

// 全部格子改为正方形 w=0.18 h=0.18，尺寸更大，16/17/18水平对齐一行
const path = [
    {x:0.015, y:0.84, w:0.18, h:0.14},
    {x:0.205, y:0.84, w:0.18, h:0.14},
    {x:0.395, y:0.84, w:0.18, h:0.14},
    {x:0.585, y:0.84, w:0.18, h:0.14},
    {x:0.775, y:0.84, w:0.18, h:0.14},
    {x:0.775, y:0.69, w:0.18, h:0.14},
    {x:0.775, y:0.53, w:0.18, h:0.14},
    {x:0.775, y:0.37, w:0.18, h:0.14},
    {x:0.775, y:0.21, w:0.18, h:0.14},
    {x:0.585, y:0.21, w:0.18, h:0.14},
    {x:0.395, y:0.21, w:0.18, h:0.14},
    {x:0.205, y:0.21, w:0.18, h:0.14},
    {x:0.015, y:0.21, w:0.18, h:0.14},
    {x:0.015, y:0.35, w:0.18, h:0.14},
    {x:0.015, y:0.50, w:0.18, h:0.14},
    {x:0.015, y:0.65, w:0.18, h:0.14},
    {x:0.205, y:0.65, w:0.18, h:0.14},
    {x:0.395, y:0.65, w:0.18, h:0.14},
    {x:0.395, y:0.50, w:0.18, h:0.14}
];
const gridColor = ["#FFB3BA","#FFDFBA","#FFFFBA","#BAFFC9","#BAE1FF","#FFB3BA","#FFDFBA","#FFFFBA","#BAFFC9","#BAE1FF","#FFB3BA","#FFDFBA","#FFFFBA","#BAFFC9","#BAE1FF","#FFB3BA","#FFDFBA","#FFFFBA","#BAFFC9"];

let pos = 0;
const totalCell = path.length;
let playerDom;
let moving = false;

const diceBtn = document.getElementById("diceBtn");
const diceEl = document.getElementById("diceEl");
const quizModal = document.getElementById("quizModal");
const winModal = document.getElementById("winModal");
const qText = document.getElementById("qText");
const optWrap = document.getElementById("optWrap");
const tipText = document.getElementById("tipText");
const musicToggle = document.getElementById("musicToggle");

function playAudio(audioEl){
    if(!audioUnlocked) return;
    audioEl.currentTime = 0;
    audioEl.play().catch(e=>{});
}

document.body.addEventListener('click',unlockAudio,{once:true});
document.body.addEventListener('touchstart',unlockAudio,{once:true});
function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    playAudio(soundUnlock);
}

musicToggle.onclick = function(){
    unlockAudio();
    if(!musicPlay){
        bgMusic.play();
        musicPlay = true;
        musicToggle.innerText = "关闭背景音乐";
    }else{
        bgMusic.pause();
        musicPlay = false;
        musicToggle.innerText = "开启背景音乐";
    }
};

function initBoard(){
    const inner = document.querySelector(".board-inner");
    inner.innerHTML = "";
    for(let i=0;i<path.length;i++){
        const cell = document.createElement("div");
        cell.className = "grid";
        cell.style.background = gridColor[i];
        cell.style.left = path[i].x*100 + "%";
        cell.style.top = path[i].y*100 + "%";
        cell.style.width = path[i].w*100 + "%";
        cell.style.height = path[i].h*100 + "%";
        cell.style.animationDelay = i*0.04 + "s";
        const numSpan = document.createElement("span");
        numSpan.className = "grid-number";
        numSpan.innerText = String(i+1);
        cell.appendChild(numSpan);
        inner.appendChild(cell);
    }
    playerDom = document.createElement("div");
    playerDom.className = "player";
    playerDom.innerText = "棋";
    inner.appendChild(playerDom);
    updatePlayer();
}
function updatePlayer(){
    const cell = path[pos];
    playerDom.style.left = (cell.x*100 + cell.w*50) + "%";
    playerDom.style.top = (cell.y*100 + cell.h*50) + "%";
    playerDom.style.transform = "translate(-50%,-50%)";
}
function setDice(num){
    let rotate;
    switch(num){
        case 1: rotate = "rotateX(0deg) rotateY(0deg)";break;
        case 2: rotate = "rotateY(180deg)";break;
        case 3: rotate = "rotateY(90deg)";break;
        case 4: rotate = "rotateY(-90deg)";break;
        case 5: rotate = "rotateX(90deg)";break;
        case 6: rotate = "rotateX(-90deg)";break;
    }
    diceEl.style.transform = rotate;
}

diceBtn.onclick = async function(){
    unlockAudio();
    // 掷骰子时自动开启背景音乐
    if(!musicPlay){
        bgMusic.play().catch(e=>{});
        musicPlay = true;
        musicToggle.innerText = "关闭背景音乐";
    }

    if(moving) return;
    moving = true;
    diceBtn.disabled = true;
    playAudio(soundDice);
    diceEl.classList.add("dice-shake");

    const num = Math.floor(Math.random()*6)+1;
    await sleep(350);
    diceEl.classList.remove("dice-shake");
    setDice(num);

    //A规则：骰子摇到几，就向前走几步
    let targetPos = pos + num;
    const maxIndex = totalCell - 1;
    if(targetPos > maxIndex){
        targetPos = maxIndex;
    }

    while(pos < targetPos){
        pos ++;
        updatePlayer();
        playAudio(soundStep);
        await sleep(400);
    }

    moving = false;
    if(pos >= maxIndex){
        playAudio(soundWin);
        winModal.style.display = "flex";
        diceBtn.disabled = false;
        return;
    }
    showQuiz();
};

async function moveBackStep(step){
    moving = true;
    for(let i=0;i<step;i++){
        pos = Math.max(0, pos-1);
        updatePlayer();
        playAudio(soundBack);
        await sleep(400);
    }
    moving = false;
    diceBtn.disabled = false;
}
function sleep(t){
    return new Promise(res=>setTimeout(res,t));
}

function showQuiz(){
    if(unusedQuestions.length === 0) resetQuestionPool();
    const qData = unusedQuestions.shift();
    qText.innerText = qData.q;
    optWrap.innerHTML = "";
    tipText.style.display = "none";

    qData.opts.forEach((optStr,idx)=>{
        const div = document.createElement("div");
        div.className = "opt";
        div.innerText = optStr;
        div.onclick = function(){
            unlockAudio();
            tipText.style.display = "block";
            optWrap.querySelectorAll(".opt").forEach(o=>o.style.pointerEvents = "none");
            if(idx === qData.answer){
                playAudio(soundRight);
                const encourage = qData.encourage ?? "回答正确！";
                tipText.innerHTML = `<span class="correct">✅ ${encourage}</span>`;
                setTimeout(()=>{
                    quizModal.style.display = "none";
                    diceBtn.disabled = false;
                },2000);
            }else{
                playAudio(soundWrong);
                const explain = qData.explain ?? "";
                tipText.innerHTML = `<span class="wrong">❌ ${explain}</span>`;
                setTimeout(async ()=>{
                    quizModal.style.display = "none";
                    await moveBackStep(2);
                },2200);
            }
        };
        optWrap.appendChild(div);
    });
    quizModal.style.display = "flex";
}

function restartGame(){
    pos = 0;
    moving = false;
    quizModal.style.display = "none";
    winModal.style.display = "none";
    resetQuestionPool();
    initBoard();
    diceBtn.disabled = false;
}

window.addEventListener("resize",initBoard);
initBoard();
</script>
</body>
</html>
